buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    // On laisse le bloc dependencies vide ou nettoyé ici, 
    // car les plugins vont être gérés par le bloc plugins {} juste en dessous.
    dependencies {
        // Géré par React Native automatiquement via settings.gradle
    }
}

plugins {
    // On charge le plugin de gestion des dépôts de React Native en premier
    id 'com.facebook.react.rootproject'
    
    // Pour les plugins Android et Kotlin, on utilise "alias" ou on récupère les versions définies par le système
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    
    // On ajoute proprement le plugin Google Services pour Firebase
    id 'com.google.gms.google-services' version '4.4.4' apply false
}